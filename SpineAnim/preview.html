<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spine 预览</title>
<link rel="stylesheet" href="css/preview.css">
</head>
<body>

<header>
  <h1>Spine 预览</h1>
  <span class="file mono" id="fileName">未载入</span>
  <select id="jsonPick" hidden></select>
  <div class="picks">
    <button id="openFiles">选择文件…</button>
    <button id="openDir">选择文件夹…</button>
  </div>
</header>

<main>
  <section class="stage bg-checker" id="stage">
    <canvas id="view"></canvas>
    <div class="drop" id="dropHint">把 .json / .atlas / 贴图一起拖进来<br><span>或用「选择文件夹」载入整个目录</span></div>
    <div class="hud mono" id="hud"></div>
    <div class="err" id="err" hidden></div>
  </section>

  <aside class="side">
    <section class="panel">
      <h2>动画<span class="hint" id="animHint">—</span></h2>
      <div class="row">
        <select id="animPick"></select>
      </div>
      <div class="row">
        <button id="playBtn" class="primary wide">播放</button>
        <button id="stepBack" title="上一帧">‹</button>
        <button id="stepFwd" title="下一帧">›</button>
      </div>
      <input type="range" id="seek" min="0" max="1" step="0.001" value="0">
      <div class="row spread mono small">
        <span id="timeLabel">0.00 / 0.00</span>
        <label class="chk"><input type="checkbox" id="loopChk" checked>循环</label>
      </div>
      <div class="row">
        <label class="lab">速度</label>
        <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1">
        <span class="mono small nowrap" id="speedLabel">1.00×</span>
      </div>
      <div class="row">
        <label class="lab">过渡</label>
        <input type="number" id="mix" min="0" max="2" step="0.05" value="0.2">
        <span class="small dim">秒</span>
      </div>
    </section>

    <section class="panel">
      <h2>皮肤<span class="hint" id="skinHint">—</span></h2>
      <div class="row">
        <button id="skinDefault">整套</button>
        <button id="skinNone">清空</button>
        <button id="skinAll">全选</button>
      </div>
      <div class="skins" id="skins"></div>
    </section>

    <section class="panel">
      <h2>视图</h2>
      <div class="row">
        <button id="fitBtn">自动取景</button>
        <button id="resetBtn">100%</button>
      </div>
      <div class="row">
        <label class="lab">背景</label>
        <select id="bgPick">
          <option value="bg-checker">棋盘</option>
          <option value="bg-light">浅色</option>
          <option value="bg-dark">深色</option>
        </select>
      </div>
      <div class="row spread">
        <label class="chk"><input type="checkbox" id="boneChk">骨骼叠加</label>
        <label class="chk"><input type="checkbox" id="pmaChk">预乘 alpha</label>
      </div>
      <div class="row spread">
        <label class="chk"><input type="checkbox" id="dragChk" checked>拖动骨骼</label>
        <span class="small dim">拖住骨骼改位置 · Esc 复位</span>
      </div>
    </section>

    <section class="panel">
      <h2>信息</h2>
      <dl class="info" id="info"></dl>
    </section>
  </aside>
</main>

<input type="file" id="fileInput" multiple accept=".json,.skel,.atlas,.txt,.png,.jpg,.jpeg,.webp" hidden>
<input type="file" id="dirInput" webkitdirectory hidden>

<script src="vendor/spine-webgl.min.js"></script>
<script src="js/loader.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
